<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <header class="bg-subtle-accent p-5">
        <nav class="navbar bg-1 fg-2 bg-transparent">
            <div class="container-fluid">
                <a class="navbar-brand"><span class="h1">Admin</span></a>
                <a class="btn-close"aria-label="Close" href="index.html"></a>
            </div>
        </nav>
    </header>
    <main>
        <table class="table table-striped table-hover container my-5">
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Cantidad</th>
                    <th scope="col">Precio</th>
                    <th scope="col">Borrar</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <tr>
                    <td>A</td>
                    <td>25</td>
                    <td>300</td>
                    <td><button class="btn btn-danger bg-danger">Borrar</button></td>
                </tr>
            </tbody>
        </table>
        <div class="container my-5 d-flex justify-content-end">
            <button class="btn btn-success bg-success" id="agregarProducto()">Agregar Producto</button>
        </div>
    </main>
    <footer>

    </footer>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
